<!DOCTYPE html>
<html lang="tr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WQEMAN🙈</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --header-bg: #000000;
      --card-bg: #1a1a1a;
      --border-color: #282828;
      --btn-bg: #ff6600;
      --btn-text: #ffffff;
      --sidebar-bg: #ffffff;
      --sidebar-text: #000000;
      --sidebar-hover: #f5f5f5;
    }

    [data-theme="light"] {
      --bg-color: #f4f4f4;
      --text-color: #111111;
      --header-bg: #ffffff;
      --card-bg: #ffffff;
      --border-color: #dddddd;
      --btn-bg: #ff3399;
      --btn-text: #ffffff;
      --sidebar-bg: #ffffff;
      --sidebar-text: #000000;
      --sidebar-hover: #eeeeee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--header-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn, .icon-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 20px;
      cursor: pointer;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-color);
      text-decoration: none;
    }

    .dropdown-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      height: 100%;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      z-index: 200;
      transition: left 0.3s ease;
      overflow-y: auto;
    }

    .dropdown-menu.active {
      left: 0;
    }

    .menu-header {
      background-color: #000;
      color: #fff;
      padding: 20px 16px;
      text-align: center;
    }

    .menu-header h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .menu-header p {
      font-size: 12px;
      color: #aaa;
    }

    .menu-list {
      list-style: none;
      padding: 10px 0;
    }

    .menu-list li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .menu-list li a:hover {
      background-color: var(--sidebar-hover);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 150;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .thumbnail-box {
      width: 100%;
      background-color: #000;
    }

    .thumbnail-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .video-details {
      padding: 14px;
    }

    .video-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-color);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
    }

    .channel-name-area {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-color);
      font-size: 14px;
      font-weight: bold;
    }

    .blue-tick {
      background-color: #1da1f2;
      color: #fff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .action-btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="header-left">
      <button class="menu-btn" id="menuToggle">☰</button>
      <a href="#" class="logo">WQEMAN🙈</a>
    </div>
    <div class="header-right">
      <!-- Sadece Tema Değiştirme Butonu Kaldı -->
      <button class="icon-btn" id="themeToggle" title="Tema Değiştir">🌓</button>
    </div>
  </header>

  <div class="dropdown-menu" id="sidebar">
    <div class="menu-header">
      <h2>Kategoriler</h2>
      <p>WQEMAN.com</p>
    </div>
    <ul class="menu-list">
      <li><a href="#">🏠 Başlangıç</a></li>
      <li><a href="#">✨ Sophieraiin Özel</a></li>
      <li><a href="#">🎬 Full HD</a></li>
      <li><a href="#">🔥 Popüler</a></li>
    </ul>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="container">
    <div class="video-card">
      <div class="thumbnail-box">
        <img src="https://i.postimg.cc/MvPphmvC/2.jpg" alt="Sophie Rain Kapak">
      </div>
      <div class="video-details">
        <div class="video-title">Sophie Rain Krem Şanti İle Şov Yapıyor</div>
        
        <a href="#" class="channel-row">
          <div class="channel-avatar">SR</div>
          <div class="channel-name-area">
            Sophieraiin 
            <span class="blue-tick">✓</span>
          </div>
        </a>

        <a href="https://voe.sx/e/vdkex5vzitjh" target="_blank" class="action-btn">Hemen İzle 🚀</a>
      </div>
    </div>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    themeToggle.addEventListener('click', () => {
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
      } else {
        body.setAttribute('data-theme', 'dark');
      }
    });
  </script>

</body>
</html>
