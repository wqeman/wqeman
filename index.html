<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WQEMAN🙈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
    }

    /* Header / Üst Alan */
    header {
      background-color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Sol Menü (Sidebar) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      z-index: 200;
      transition: left 0.3s ease;
      overflow-y: auto;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-top {
      background-color: #000000;
      color: #ffffff;
      padding: 20px 16px;
      text-align: center;
    }

    .sidebar-top h2 {
      font-size: 18px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .sidebar-top p {
      font-size: 12px;
      color: #ccc;
      line-height: 1.4;
    }

    .sidebar-menu {
      list-style: none;
      padding: 10px 0;
    }

    .sidebar-menu li a {
      display: block;
      padding: 12px 20px;
      color: #333;
      text-decoration: none;
      font-size: 15px;
      border-bottom: 1px solid #eee;
    }

    .sidebar-menu li a:hover {
      background-color: #f5f5f5;
      color: #000;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 150;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    /* Ana İçerik */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Video Kartı */
    .video-card {
      background-color: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #282828;
    }

    .thumbnail-box {
      width: 100%;
      background-color: #000;
    }

    .thumbnail-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .video-details {
      padding: 14px;
    }

    .video-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* Kanal Bilgisi (Video Altında) */
    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #ff0055;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
    }

    .channel-name-area {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }

    .channel-name-area:hover {
      color: #1da1f2;
    }

    .blue-tick {
      background-color: #1da1f2;
      color: #fff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .action-btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background-color: #e50914;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <button class="menu-btn" id="menuToggle">☰</button>
    <a href="#" class="logo">WQEMAN🙈</a>
    <button class="search-btn">🔍</button>
  </header>

  <!-- Doeda Tarzı Açılır Menü -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <h2>WQEMAN.com 😎</h2>
      <p>Özel içerik platformu. En hızlı ve kesintisiz video deneyimi.</p>
    </div>
    <ul class="sidebar-menu">
      <li><a href="#">Başlangıç</a></li>
      <li><a href="#">Sophieraiin Özel</a></li>
      <li><a href="#">Full HD</a></li>
      <li><a href="#">Popüler</a></li>
      <li><a href="#">Trendler</a></li>
    </ul>
  </div>
  <div class="overlay" id="overlay"></div>

  <!-- İçerik Alanı -->
  <div class="container">

    <!-- Tek Video Kartı -->
    <div class="video-card">
      <div class="thumbnail-box">
        <img src="https://i.postimg.cc/MvPphmvC/2.jpg" alt="Sophie Rain Kapak">
      </div>
      <div class="video-details">
        <div class="video-title">Sophie Rain Krem Şanti İle Şov Yapıyor</div>
        
        <!-- Kanal Profili (Tıklanınca kanala gider) -->
        <a href="#" class="channel-row">
          <div class="channel-avatar">SR</div>
          <div class="channel-name-area">
            Sophieraiin 
            <span class="blue-tick" title="Mavi Tik">✓</span>
          </div>
        </a>

        <a href="https://voe.sx/e/vdkex5vzitjh" target="_blank" class="action-btn">Hemen İzle 🚀</a>
      </div>
    </div>

  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
