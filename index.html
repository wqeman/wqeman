<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WQEMAN🙈 - Video Platformu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
    }

    /* Header / Üst Menü */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background-color: #121212;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #272727;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff0055;
      text-decoration: none;
      cursor: pointer;
    }

    .logo span {
      color: #ffffff;
    }

    .search-bar {
      display: flex;
      width: 40%;
      max-width: 600px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px;
      background-color: #121212;
      border: 1px solid #303030;
      border-radius: 20px 0 0 20px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    .search-bar input:focus {
      border-color: #ff0055;
    }

    .search-bar button {
      padding: 10px 20px;
      background-color: #222222;
      border: 1px solid #303030;
      border-left: none;
      border-radius: 0 20px 20px 0;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-bar button:hover {
      background-color: #333333;
    }

    /* Kanal Profil Banner Alanı */
    .channel-header {
      background: linear-gradient(to bottom, #1f1f1f, #121212);
      padding: 30px 40px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .channel-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #ff0055;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 3px solid #333;
    }

    .channel-details h1 {
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* Mor Tik Stili */
    .verified-badge {
      background-color: #9c27b0;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(156, 39, 176, 0.6);
    }

    .channel-meta {
      font-size: 14px;
      color: #aaa;
    }

    /* Kategori Butonları */
    .categories {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      background-color: #0f0f0f;
      overflow-x: auto;
      border-bottom: 1px solid #1f1f1f;
    }

    .category-btn {
      padding: 8px 16px;
      background-color: #272727;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .category-btn:hover, .category-btn.active {
      background-color: #ff0055;
    }

    /* Video Izgarası (Grid) */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 24px;
    }

    .video-card {
      background-color: #181818;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #222;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(255, 0, 85, 0.2);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Oranı */
      background-color: #000;
      overflow: hidden;
    }

    .thumbnail-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 14px;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #fff;
    }

    .video-meta {
      font-size: 13px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    /* Responsive Tasarım */
    @media (max-width: 768px) {
      .search-bar {
        width: 50%;
      }
      .channel-header {
        padding: 20px;
      }
      .video-grid {
        grid-template-columns: 1fr;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">
      WQEMAN<span>🙈</span>
    </a>
    <div class="search-bar">
      <input type="text" placeholder="Video ara...">
      <button>Ara</button>
    </div>
  </header>

  <!-- Kanal Banner ve Bilgileri (Mor Tikli) -->
  <div class="channel-header">
    <div class="channel-avatar">WQ</div>
    <div class="channel-details">
      <h1>WQEMAN Resmi Kanal <span class="verified-badge" title="Doğrulanmış Kanal">✓</span></h1>
      <div class="channel-meta">1.5M Abone • 1 Video</div>
    </div>
  </div>

  <!-- YouTube / Doeda Tarzı Kategoriler -->
  <div class="categories">
    <button class="category-btn active">Tümü</button>
    <button class="category-btn">Trendler</button>
    <button class="category-btn">En Çok İzlenen</button>
    <button class="category-btn">Popüler</button>
    <button class="category-btn">Yeni Eklenenler</button>
    <button class="category-btn">Özel Koleksiyon</button>
  </div>

  <!-- Video Izgarası -->
  <main class="video-grid">

    <!-- Sophie Rain Videosu -->
    <a href="https://voe.sx/e/vdkex5vzitjh" target="_blank" class="video-card">
      <div class="thumbnail-container">
        <img src="https://i.postimg.cc/MvPphmvC/2.jpg" alt="Sophie Rain Kapak">
      </div>
      <div class="video-info">
        <div class="video-title">Sophie Rain Soyunup Dildo Üzerinde Krem Şanti Yiyor</div>
        <div class="video-meta">
          <span>45.2 B Görüntüleme</span>
          <span>1 gün önce</span>
        </div>
      </div>
    </a>

  </main>

</body>
  </html>
